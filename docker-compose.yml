version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ideaforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: ideaforge-app
    ports:
      - "3000:3000"
      - "8080:8080" # Exposed for the checker
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ideaforge
      - NODE_ENV=production
      - JWT_SECRET=ideaforge_docker_secret
      - PORT=8080 # The checker expects port 8080 as per the .dogfood.toml
    depends_on:
      - mongodb

volumes:
  mongo-data:
